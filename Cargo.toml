[workspace]
resolver = "2"
members = ["crates/rshash", "crates/rshash-cli", "crates/rshash-tools"]
default-members = ["crates/rshash", "crates/rshash-cli", "crates/rshash-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "Rust port of RSHash: a k-mer dictionary based on rank/select bitvectors, with gapped k-mer (shape) support"

[workspace.dependencies]
rshash = { path = "crates/rshash" }
needletail = "0.7"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.test]
opt-level = 2
